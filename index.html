<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do Dashboard</title>
  <script>
    /* Inline theme restore — runs before first paint to prevent flash */
    (function () {
      const t = localStorage.getItem('tdd_theme');
      if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    })();
  </script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ── Settings Bar ─────────────────────────────────────────────────── -->
  <header id="settings-bar">

    <!-- Theme toggle -->
    <div class="settings-group">
      <button id="theme-toggle" type="button">🌙 Dark mode</button>
    </div>

    <!-- Custom name -->
    <div class="settings-group">
      <label for="name-input">Your name:</label>
      <input type="text" id="name-input" placeholder="e.g. Farhan" maxlength="40" />
      <button id="name-save" class="btn-primary" type="button">Save</button>
    </div>

    <!-- Pomodoro duration -->
    <div class="settings-group">
      <label for="timer-duration-input">Pomodoro (min):</label>
      <input type="number" id="timer-duration-input" min="1" max="60" value="25" />
      <button id="timer-duration-save" class="btn-primary" type="button">Set</button>
      <span id="timer-duration-error" class="error" hidden></span>
    </div>

    <!-- Storage status (hidden by default, shown on quota error) -->
    <span id="storage-status" class="error" hidden></span>

  </header>

  <main>

    <!-- ── Left column wrapper ──────────────────────────────────────────── -->
    <div class="left-col">

      <!-- Greeting Panel -->
      <section id="greeting-panel" aria-label="Greeting and clock">
        <div id="clock-display" role="timer" aria-live="polite">00:00:00</div>
        <div id="date-display" class="text-muted"></div>
        <h1 id="greeting-text">Good morning</h1>
      </section>

      <!-- Timer Panel -->
      <section id="timer-panel" aria-label="Focus timer">
        <h2>Focus Timer</h2>
        <div id="timer-display" role="timer" aria-live="polite" aria-label="Countdown timer">25:00</div>
        <div id="timer-controls">
          <button id="timer-start" type="button" class="btn-primary">▶ Start</button>
          <button id="timer-stop"  type="button" class="btn-warning">⏸ Stop</button>
          <button id="timer-reset" type="button" class="btn-secondary">↺ Reset</button>
        </div>
        <div id="timer-config">
          <!-- Duration config is controlled from settings-bar; this area is reserved -->
        </div>
      </section>

    </div><!-- /.left-col -->

    <!-- ── Right column wrapper ─────────────────────────────────────────── -->
    <div class="right-col">

      <!-- To-Do Panel -->
      <section id="todo-panel" aria-label="To-do list">
        <h2>To-Do List</h2>

        <!-- Add task row -->
        <div id="add-task-row">
          <input type="text" id="add-task-input" placeholder="Add a new task…" maxlength="200" aria-label="New task description" />
          <button id="add-task-btn" type="button" class="btn-primary">+ Add</button>
        </div>
        <span id="add-task-error" class="error" hidden></span>

        <!-- Sort row -->
        <div id="sort-row">
          <label for="sort-select">Sort by:</label>
          <select id="sort-select" aria-label="Sort tasks">
            <option value="default">Default (creation order)</option>
            <option value="alpha-asc">Alphabetical A–Z</option>
            <option value="alpha-desc">Alphabetical Z–A</option>
            <option value="completed-last">Completed last</option>
            <option value="completed-first">Completed first</option>
          </select>
        </div>

        <!-- Task list -->
        <ul id="task-list" aria-label="Task list" aria-live="polite"></ul>
      </section>

      <!-- Quick Links Panel -->
      <section id="links-panel" aria-label="Quick links">
        <h2>Quick Links</h2>

        <!-- Add link form -->
        <div id="add-link-form">
          <input type="text"  id="link-label-input" placeholder="Label (e.g. Gmail)" maxlength="40"  aria-label="Link label" />
          <input type="url"   id="link-url-input"   placeholder="https://example.com" maxlength="500" aria-label="Link URL" />
          <button id="add-link-btn" type="button" class="btn-primary">+ Add Link</button>
        </div>
        <span id="add-link-error" class="error" hidden></span>

        <!-- Links grid -->
        <div id="links-grid" aria-live="polite"></div>
      </section>

    </div><!-- /.right-col -->

  </main>

  <script src="js/app.js"></script>
</body>
</html>
